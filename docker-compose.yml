services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verifia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verifia_db}
      POSTGRES_USER: ${POSTGRES_USER:-verifia_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verifia_user} -d ${POSTGRES_DB:-verifia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verifia_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifia_backend
    restart: unless-stopped
    # The development bind mounts are owned by the host account. Keep local
    # Compose writable across Windows/macOS/Linux; production uses image UID 10001.
    user: "0:0"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-verifia_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-verifia_db}"
      - "ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-verifia_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-verifia_db}"
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./workflows:/app/workflows
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "0:0"
    command: ["python", "-m", "app.events.worker"]
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - "DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-verifia_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-verifia_db}"
      - "ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-verifia_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-verifia_db}"
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./workflows:/app/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifia_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
